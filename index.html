<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Victor Therache, développeur full-stack PHP/Symfony et React. Portfolio interactif façon 1989. / Full-stack developer portfolio, as a neon game.">
<title>Victor Néon 89</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Kanit:ital,wght@1,700;1,800;1,900&family=VT323&display=swap">
<style>
/* Layout : écran CRT plein cadre. Ville pixel vue de dessus en fond (canvas), nom néon et chapitres à gauche, OSD de magnétoscope aux quatre coins. Un seul univers sombre, assumé. */
:root{
  --night:#0a0612;
  --night-2:#170d27;
  --magenta:#ff2e88;
  --cyan:#2ef2ff;
  --amber:#ffb53b;
  --violet:#a46bff;
  --ink:#fff3e6;
  --dim:#a99cc6;
  --acc:var(--magenta);
  --chroma:var(--cyan);
  --font-display:"Kanit","Arial Black",Impact,sans-serif;
  --font-body:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --font-osd:"VT323","Courier New",ui-monospace,monospace;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit}

/* ---------- ville ---------- */
#city{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0;transition:filter .7s ease}
body.in-chapter #city{filter:brightness(.3) saturate(1.25)}
.track{position:fixed;left:0;right:0;top:-22vh;height:18vh;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--ink) 6%,transparent) 42%,color-mix(in srgb,var(--cyan) 11%,transparent) 50%,transparent);
  animation:track 9s linear infinite}
@keyframes track{to{transform:translateY(150vh)}}

/* ---------- extrusion néon partagée ---------- */
.ext{
  --e1:var(--acc);
  --e2:color-mix(in srgb,var(--acc) 72%,var(--night));
  --e3:color-mix(in srgb,var(--acc) 48%,var(--night));
  --e4:color-mix(in srgb,var(--acc) 26%,var(--night));
  text-shadow:
    .012em .012em 0 var(--e1), .024em .024em 0 var(--e1),
    .036em .036em 0 var(--e2), .048em .048em 0 var(--e2),
    .06em .06em 0 var(--e3), .072em .072em 0 var(--e3),
    .084em .084em 0 var(--e4), .096em .096em 0 var(--e4),
    -.028em 0 0 color-mix(in srgb,var(--chroma) 75%,transparent),
    0 0 .3em color-mix(in srgb,var(--acc) 55%,transparent);
}

/* ---------- menu ---------- */
.menu-screen{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;scrollbar-width:none;
  padding-block:calc(4.4rem + var(--top)) calc(4.8rem + var(--bot));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  background:linear-gradient(90deg,color-mix(in srgb,var(--night) 78%,transparent),color-mix(in srgb,var(--night) 30%,transparent) 55%,transparent 80%)}
.menu-inner{display:flex;flex-direction:column;gap:clamp(1rem,3.2vh,2.3rem);margin-left:clamp(0px,7vw - 48px,150px);min-width:0}
.kicker{margin:0;font-family:var(--font-osd);font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 10px color-mix(in srgb,var(--cyan) 60%,transparent)}
.title-wrap{transform-origin:left 70%;will-change:transform}
.title{margin:0;font-family:var(--font-display);font-style:italic;font-weight:900;font-size:clamp(3.8rem,15vw,10.5rem);line-height:.86;letter-spacing:-.005em;color:var(--ink);transform:skewX(-7deg);transform-origin:left bottom;white-space:nowrap}
.title .ch{display:inline-block;will-change:transform}
.title.glitch{animation:glitch .3s steps(2) 1}
@keyframes glitch{
  0%{transform:skewX(-7deg)}
  25%{transform:skewX(-7deg) translateX(-.05em);filter:hue-rotate(80deg)}
  50%{transform:skewX(-15deg) translateX(.04em)}
  75%{transform:skewX(-7deg) translateX(-.02em);filter:hue-rotate(-60deg)}
  100%{transform:skewX(-7deg)}}
.tagline{margin:0;font-weight:600;font-size:clamp(1rem,2.4vw,1.25rem);letter-spacing:.03em;max-width:46ch;text-wrap:balance}
.tagline .sep{color:var(--magenta);margin-inline:.35em}

.menu-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem}
.item{position:relative;isolation:isolate;display:grid;grid-template-columns:2.6ch auto auto;column-gap:.8rem;align-items:baseline;justify-content:start;
  background:none;border:0;color:var(--ink);text-align:left;cursor:pointer;padding:.18rem 1.1rem .22rem .55rem;transform:skewX(-8deg);transition:color .12s}
.item .num{font-family:var(--font-osd);font-size:1.35rem;color:var(--dim)}
.item .lbl{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:clamp(1.55rem,5vw,2.55rem);line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.item .seen{font-family:var(--font-osd);font-size:1.1rem;color:var(--amber);letter-spacing:.08em}
.item .loc{grid-column:2 / 4;font-family:var(--font-osd);font-size:1.15rem;color:var(--dim);letter-spacing:.05em;margin-top:-.15rem}
.item::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--magenta),color-mix(in srgb,var(--magenta) 55%,var(--amber)));transform:scaleX(0);transform-origin:left;transition:transform .16s cubic-bezier(.2,.9,.3,1.2)}
.item.sel{color:var(--night);animation:nudge 1.1s ease-in-out infinite}
.item.sel::before{transform:scaleX(1);box-shadow:0 0 28px color-mix(in srgb,var(--magenta) 55%,transparent)}
.item.sel .num,.item.sel .loc,.item.sel .seen{color:color-mix(in srgb,var(--night) 78%,var(--magenta))}
.item.sel .num::before{content:"▶";position:absolute;left:-1.3em;color:var(--magenta);text-shadow:0 0 8px var(--magenta)}
.item:focus{outline:none}
.item:focus-visible{outline:2px dashed var(--cyan);outline-offset:5px}
@keyframes nudge{50%{transform:skewX(-8deg) translateX(10px)}}
.sound-hint{margin:0;font-family:var(--font-osd);font-size:1.2rem;color:var(--amber);letter-spacing:.06em;animation:blink 1.4s steps(1) infinite}

/* ---------- HUD / OSD ---------- */
.hud{position:fixed;inset:0;z-index:9;pointer-events:none;font-family:var(--font-osd);font-size:clamp(1.1rem,2.3vw,1.5rem);letter-spacing:.07em;color:var(--ink);
  text-shadow:2px 2px 0 color-mix(in srgb,var(--night) 85%,transparent)}
.hud::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(4rem + var(--top));background:linear-gradient(180deg,color-mix(in srgb,var(--night) 70%,transparent),transparent)}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(5.5rem + var(--bot));background:linear-gradient(0deg,color-mix(in srgb,var(--night) 80%,transparent),transparent)}
.hud .c{position:absolute;z-index:1;display:flex;gap:.7em;align-items:center}
.hud .hud-tl{top:calc(12px + var(--top));left:max(16px, env(safe-area-inset-left,0px))}
.hud .hud-tr{top:calc(10px + var(--top));right:max(16px, env(safe-area-inset-right,0px))}
.hud .hud-bl{bottom:calc(12px + var(--bot));left:max(16px, env(safe-area-inset-left,0px));flex-direction:column;align-items:flex-start;gap:0}
.hud .hud-br{bottom:calc(10px + var(--bot));right:max(16px, env(safe-area-inset-right,0px));flex-direction:column;align-items:flex-end;gap:.15em}
.rec::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--magenta);box-shadow:0 0 8px var(--magenta);margin-right:.45em;vertical-align:.05em;animation:blink 1.1s steps(1) infinite}
.osd-btn{pointer-events:auto;color:inherit;font-family:var(--font-osd);font-size:inherit;letter-spacing:inherit;cursor:pointer;
  background:color-mix(in srgb,var(--night) 60%,transparent);border:1px solid color-mix(in srgb,var(--ink) 35%,transparent);padding:0 .5em;white-space:nowrap}
.osd-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.osd-btn:focus-visible{outline:2px dashed var(--cyan);outline-offset:3px}
.lang .on{color:var(--cyan);text-shadow:0 0 8px color-mix(in srgb,var(--cyan) 60%,transparent)}
.lang .off{color:var(--dim)}
.hint,.credit{color:var(--dim);font-size:.82em}
.hint-touch{display:none;color:var(--dim);font-size:.82em}
@media (hover:none){.hint{display:none}.hint-touch{display:inline}}
@media (max-width:640px){.hint,.hint-touch{display:none}}
@media (max-width:430px){.hud .hud-tr #timecode{display:none}}
.score{font-variant-numeric:tabular-nums}
.score b{font-weight:400;color:var(--amber);text-shadow:0 0 10px color-mix(in srgb,var(--amber) 50%,transparent)}
.combo{color:var(--magenta);font-size:.9em}
.combo-bar{width:7.5em;height:4px;background:color-mix(in srgb,var(--ink) 16%,transparent)}
.combo-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--magenta),var(--amber))}
@keyframes blink{50%{opacity:0}}

/* ---------- chapitre ---------- */
.chapter{position:fixed;inset:0;z-index:3;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--acc) transparent;
  padding-block:calc(4.6rem + var(--top)) calc(6rem + var(--bot));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px))}
.chapter-inner{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:1.8rem;min-width:0}
.back{align-self:flex-start;font-family:var(--font-osd);font-size:1.4rem;letter-spacing:.08em;color:var(--ink);cursor:pointer;
  background:color-mix(in srgb,var(--night) 70%,transparent);border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);padding:.05em .7em}
.back:hover,.back:focus-visible{border-color:var(--acc);color:var(--acc);outline:none}
.ch-head .kicker{color:var(--acc);text-shadow:0 0 10px color-mix(in srgb,var(--acc) 55%,transparent)}
.ch-title{margin:.15em 0 0;font-family:var(--font-display);font-style:italic;font-weight:900;font-size:clamp(2.5rem,9vw,5.6rem);line-height:.92;transform:skewX(-7deg);transform-origin:left bottom;text-wrap:balance}
.sub{margin:0 0 .8rem;font-family:var(--font-osd);font-weight:400;font-size:1.5rem;letter-spacing:.1em;color:var(--acc)}
.todo{color:var(--amber);border-bottom:1px dashed color-mix(in srgb,var(--amber) 70%,transparent)}
.foot-note{margin:2rem 0 0;font-family:var(--font-osd);font-size:1.2rem;color:var(--dim);border-top:1px dashed color-mix(in srgb,var(--ink) 22%,transparent);padding-top:1rem;max-width:70ch}
.panel{background:color-mix(in srgb,var(--night-2) 90%,transparent);border:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}

/* présentation */
.pres{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(1.4rem,4vw,3.2rem);align-items:start}
@media (max-width:760px){.pres{grid-template-columns:minmax(0,1fr)}}
.idcard{padding:1.1rem;display:flex;flex-direction:column;gap:.9rem;border-color:color-mix(in srgb,var(--acc) 60%,transparent);box-shadow:8px 8px 0 color-mix(in srgb,var(--acc) 30%,transparent)}
.idcard .tape{display:flex;justify-content:space-between;font-family:var(--font-osd);font-size:1.15rem;color:var(--dim);letter-spacing:.08em}
.avatar{display:block;width:100%;max-width:100%;aspect-ratio:1;image-rendering:pixelated;background:linear-gradient(180deg,var(--violet),var(--magenta) 62%,var(--amber))}
.idcard .nm{margin:0;font-family:var(--font-display);font-style:italic;font-weight:800;font-size:2.1rem;line-height:1}
.stats{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.4rem 1rem;margin:0}
.stats dt{font-family:var(--font-osd);font-size:1.2rem;color:var(--dim);letter-spacing:.06em}
.stats dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.prose p{margin:0 0 1rem;font-size:1.08rem;line-height:1.65;max-width:62ch}
.prose .lead{font-size:clamp(1.2rem,2.6vw,1.45rem);font-weight:600;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;list-style:none;margin:0;padding:0}
.chips li{font-family:var(--font-osd);font-size:1.2rem;padding:.02em .55em;border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);background:color-mix(in srgb,var(--acc) 12%,transparent)}

/* projets */
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:1.2rem}
.file{position:relative;padding:1.1rem 1.2rem 1.25rem;display:flex;flex-direction:column;gap:.65rem;min-width:0;outline:none;
  transition:transform .15s,border-color .15s,box-shadow .15s}
.file:hover,.file:focus-visible{transform:translate(-3px,-3px);border-color:var(--acc);box-shadow:7px 7px 0 color-mix(in srgb,var(--acc) 50%,transparent)}
.file .top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-family:var(--font-osd);font-size:1.2rem;color:var(--dim);letter-spacing:.06em}
.pill{font-family:var(--font-osd);font-size:1.1rem;padding:0 .45em;background:var(--acc);color:var(--night);letter-spacing:.04em;white-space:nowrap}
.file h3{margin:0;font-family:var(--font-display);font-style:italic;font-weight:800;font-size:1.6rem;line-height:1.05;text-wrap:balance}
.file .tag{margin:0;color:var(--acc);font-weight:600}
.file .d{margin:0;line-height:1.55;color:color-mix(in srgb,var(--ink) 86%,var(--dim))}
.file .chips li{font-size:1.1rem}
.file a{align-self:flex-start;font-family:var(--font-osd);font-size:1.25rem;color:var(--acc)}
.stamp{position:absolute;top:-.75em;right:.9rem;font-family:var(--font-osd);font-size:1.05rem;background:var(--amber);color:var(--night);padding:0 .45em;transform:rotate(3deg);letter-spacing:.06em}

/* frise */
.frise{list-style:none;margin:0;padding:0 0 0 1.7rem;border-left:2px solid color-mix(in srgb,var(--acc) 60%,transparent);display:flex;flex-direction:column;gap:1.8rem;max-width:760px}
.frise > li{position:relative}
.frise > li::before{content:"";position:absolute;left:calc(-1.7rem - 8px);top:.5rem;width:12px;height:12px;background:var(--night);border:2px solid var(--acc);box-shadow:0 0 10px var(--acc);transform:rotate(45deg)}
.yr{font-family:var(--font-osd);font-size:1.4rem;color:var(--acc);letter-spacing:.06em}
.frise h3{margin:.1rem 0 .15rem;font-family:var(--font-display);font-style:italic;font-weight:800;font-size:1.6rem;line-height:1.1}
.frise .place{margin:0;font-weight:600}
.frise .note{margin:.35rem 0 0;line-height:1.6;max-width:62ch;color:color-mix(in srgb,var(--ink) 86%,var(--dim))}
.points{list-style:none;margin:.55rem 0 0;padding:0;display:flex;flex-direction:column;gap:.4rem;max-width:66ch}
.points li{position:relative;padding-left:1.3rem;line-height:1.55;color:color-mix(in srgb,var(--ink) 86%,var(--dim))}
.points li::before{content:"▸";position:absolute;left:0;color:var(--acc)}

/* contact */
.contacts{display:flex;flex-direction:column;gap:.8rem;max-width:760px}
.crow{display:grid;grid-template-columns:7.5rem minmax(0,1fr) auto;gap:.6rem 1rem;align-items:center;padding:.85rem 1rem}
@media (max-width:560px){.crow{grid-template-columns:minmax(0,1fr) auto}.crow .lab{grid-column:1 / -1}}
.crow .lab{font-family:var(--font-osd);font-size:1.25rem;color:var(--dim);letter-spacing:.06em}
.crow .val{font-weight:600;font-size:1.1rem;overflow-wrap:anywhere}
.crow .val a{color:inherit}
.copy{font-family:var(--font-osd);font-size:1.2rem;letter-spacing:.06em;background:none;border:1px solid var(--acc);color:var(--acc);padding:.05em .7em;cursor:pointer;white-space:nowrap}
.copy:hover,.copy:focus-visible{background:var(--acc);color:var(--night);outline:none}
.outro{margin:0;font-family:var(--font-osd);font-size:1.5rem;color:var(--dim);letter-spacing:.06em}

/* ---------- carton de chapitre ---------- */
.card{position:fixed;inset:0;z-index:6;background:var(--night);display:flex;flex-direction:column;justify-content:center;overflow:hidden;cursor:pointer;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--acc) 9%,transparent) 0 2px,transparent 2px 7px);animation:roll .7s linear infinite}
.card::after{content:"";position:absolute;left:0;right:0;bottom:22%;height:3px;background:var(--acc);box-shadow:0 0 18px var(--acc);transform-origin:left;animation:wipe 1.7s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes roll{to{background-position:0 14px}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.card-inner{position:relative;display:flex;flex-direction:column;gap:.5rem;margin-left:clamp(0px,8vw - 40px,150px);min-width:0}
.card-num{margin:0;font-family:var(--font-osd);font-size:clamp(1.4rem,3vw,2rem);color:var(--acc);letter-spacing:.22em}
.card-title{margin:0;font-family:var(--font-display);font-style:italic;font-weight:900;font-size:clamp(2.6rem,11vw,8.6rem);line-height:.9;transform:skewX(-7deg);transform-origin:left bottom;overflow-wrap:anywhere}
.card-sub{margin:.4rem 0 0;font-weight:600;font-size:clamp(1.1rem,2.6vw,1.6rem)}
.card-skip{margin:1.4rem 0 0;font-family:var(--font-osd);font-size:1.15rem;color:var(--dim);letter-spacing:.08em}
.card.on .card-num{animation:fadein .3s both}
.card.on .card-title{animation:slam .55s cubic-bezier(.2,1.35,.35,1) .08s both}
.card.on .card-sub{animation:fadein .4s .45s both}
@keyframes slam{from{transform:skewX(-7deg) translateX(-35vw);opacity:0}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}

/* ---------- rembobinage ---------- */
.rew{position:fixed;inset:0;z-index:7;pointer-events:none;mix-blend-mode:screen;
  background:repeating-linear-gradient(180deg,color-mix(in srgb,var(--ink) 9%,transparent) 0 3px,transparent 3px 10px);animation:rewind .1s linear infinite}
.rew span{position:absolute;top:calc(58px + var(--top));left:max(16px, env(safe-area-inset-left,0px));font-family:var(--font-osd);font-size:2.2rem;letter-spacing:.1em;color:var(--ink)}
@keyframes rewind{to{background-position:0 -40px}}

/* ---------- note de fin ---------- */
.grade{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:color-mix(in srgb,var(--night) 84%,transparent);overflow-y:auto;
  padding-block:calc(4rem + var(--top)) calc(4rem + var(--bot));
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.grade-box{--acc:var(--amber);--chroma:var(--magenta);display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center}
.grade-box h2{margin:0;font-family:var(--font-osd);font-weight:400;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:.2em;color:var(--cyan)}
.grade-box .lbl{margin:.4rem 0 0;font-family:var(--font-osd);font-size:1.3rem;color:var(--dim);letter-spacing:.2em}
.letter{margin:0;font-family:var(--font-display);font-style:italic;font-weight:900;font-size:clamp(7rem,30vw,14rem);line-height:.9;transform:skewX(-7deg);animation:slam .6s cubic-bezier(.2,1.35,.35,1) both}
.grade-box dl{display:grid;grid-template-columns:auto auto;gap:.25rem 2.4rem;margin:.8rem 0 1.2rem;font-family:var(--font-osd);font-size:1.4rem;letter-spacing:.05em}
.grade-box dt{color:var(--dim);text-align:left}
.grade-box dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.btn{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:1.4rem;text-transform:uppercase;color:var(--night);background:var(--amber);border:0;padding:.35em 1.2em;cursor:pointer;transform:skewX(-8deg);box-shadow:5px 5px 0 var(--magenta)}
.btn:focus-visible{outline:2px dashed var(--cyan);outline-offset:4px}

/* ---------- points ---------- */
.pop{position:fixed;z-index:9;pointer-events:none;font-family:var(--font-display);font-style:italic;font-weight:800;font-size:1.6rem;line-height:1;color:var(--amber);white-space:nowrap;text-align:center;
  text-shadow:2px 2px 0 var(--magenta),0 0 14px color-mix(in srgb,var(--amber) 60%,transparent);animation:pop 1.15s ease-out forwards}
.pop small{display:block;margin-top:.2rem;font-family:var(--font-osd);font-style:normal;font-weight:400;font-size:1.05rem;color:var(--ink);letter-spacing:.1em;text-shadow:1px 1px 0 var(--night)}

        const sp = 12 + hash(r, k, 10 + lane) * 16, base = hash(r, k, 20 + lane) * PERIOD;
        const pos = (((base + dir * t * sp) % PERIOD) + PERIOD) % PERIOD;
        const col = pick(CARS, hash(r, k, 30 + lane)), pol = hash(r, k, 40 + lane) > 0.94;
        for (let m = m0x; m <= m1x; m++) car(m * PERIOD + pos, y, dir, 0, col, pol, false, t);
      }
    }
    for (let c = c0; c <= c1; c++) for (let lane = 0; lane < 2; lane++) {
      const dir = lane ? 1 : -1, x = c * CELL + (lane ? ROAD * 0.28 : ROAD * 0.72);
      for (let k = 0; k < 3; k++) {
        const sp = 12 + hash(c, k, 50 + lane) * 16, base = hash(c, k, 60 + lane) * PERIOD;
        const pos = (((base + dir * t * sp) % PERIOD) + PERIOD) % PERIOD;
        const col = pick(CARS, hash(c, k, 70 + lane)), pol = hash(c, k, 80 + lane) > 0.94;
        for (let m = m0y; m <= m1y; m++) car(x, m * PERIOD + pos, 0, dir, col, pol, false, t);
      }
    }
  }

  function frame(now) {
    const t = now / 1000;
    const cam = RM
      ? { x: 400 + t * 2, y: 300 + t * 1.2, a: -0.06, z: 1 }
      : { x: 400 + t * 9, y: 300 + t * 5.5, a: Math.sin(t * 0.11) * 0.12 - 0.04, z: 1 + Math.sin(t * 0.083) * 0.07 };
    glows = [];
    cx.globalCompositeOperation = 'source-over';
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.translate(W / 2, H / 2); cx.rotate(cam.a); cx.scale(cam.z, cam.z); cx.translate(-cam.x, -cam.y);
    const rad = Math.hypot(W, H) / 2 / cam.z + CELL;
    cx.fillStyle = COL.asphalt; cx.fillRect(cam.x - rad, cam.y - rad, rad * 2, rad * 2);
    const c0 = Math.floor((cam.x - rad) / CELL), c1 = Math.floor((cam.x + rad) / CELL);
    const r0 = Math.floor((cam.y - rad) / CELL), r1 = Math.floor((cam.y + rad) / CELL);
    for (let iy = r0; iy <= r1; iy++) for (let ix = c0; ix <= c1; ix++) cell(ix, iy, t);
    traffic(cam.x - rad, cam.x + rad, cam.y - rad, cam.y + rad, t);
    const world = cx.getTransform();
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.globalCompositeOperation = 'multiply';
    cx.fillStyle = `hsl(${292 + Math.sin(t * 0.05) * 22},70%,62%)`; cx.fillRect(0, 0, W, H);
    cx.setTransform(world); cx.globalCompositeOperation = 'lighter';
    for (const g of glows) { cx.globalAlpha = g.a; cx.drawImage(g.s, g.x - g.r, g.y - g.r, g.r * 2, g.r * 2); }
    cx.globalAlpha = 1; cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.globalCompositeOperation = 'screen';
    const gr = cx.createLinearGradient(0, H, 0, 0);
    gr.addColorStop(0, 'rgba(255,46,136,.22)'); gr.addColorStop(0.5, 'rgba(164,107,255,.06)'); gr.addColorStop(1, 'rgba(46,242,255,.08)');
    cx.fillStyle = gr; cx.fillRect(0, 0, W, H);
    cx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }
  function start() { resize(); addEventListener('resize', resize); requestAnimationFrame(frame); }
  return { start };
})();

/* =====================================================================
   PORTRAIT PIXEL (remplace-le par ta photo si tu veux)
   ===================================================================== */
const PORTRAIT = [
  '................',
  '.....HHHHHH.....',
  '....HHHHHHHH....',
  '...HHHHHHHHHH...',
  '...HHSSSSSSHH...',
  '...HSSSSSSSSH...',
  '..SGGGGSSGGGGS..',
  '..SGLGGSSGLGGS..',
  '...SSSSSSSSSS...',
  '...SSSMMMMSSS...',
  '....SSSSSSSS....',
  '.....SSSSSS.....',
  '......SSSS......',
  '...JJJCCCCJJJ...',
  '..JJJJJCCJJJJJ..',
  '.JJJJJJJJJJJJJJ.'
];
const PAL = { H: '#24112c', S: '#e9a37c', G: '#0b0612', L: '#2ef2ff', M: '#b5604a', J: '#3a1a5c', C: '#fff3e6' };
function drawPortrait(cv) {
  const g = cv.getContext('2d');
  PORTRAIT.forEach((row, y) => [...row].forEach((ch, x) => { if (PAL[ch]) { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); } }));
}

/* =====================================================================
   PAGES DES CHAPITRES
   ===================================================================== */
const RENDER = {
  presentation() {
    const p = C().presentation;
    return `<div class="pres">
      <aside class="idcard panel">
        <div class="tape"><span>${T().idcard}</span><span>N°001</span></div>
        <canvas class="avatar" id="avatar" width="16" height="16" role="img" aria-label="${esc(T().portrait)}"></canvas>
        <p class="nm">${fmt(PROFILE.fullName)}</p>
        <dl class="stats">${p.stats.map(([k, v]) => `<dt>${fmt(k)}</dt><dd>${fmt(v)}</dd>`).join('')}</dl>
      </aside>
      <div class="prose">
        <p class="lead">${fmt(p.lead)}</p>
        ${p.paragraphs.map(t => `<p>${fmt(t)}</p>`).join('')}
        <h3 class="sub">${T().arsenal}</h3>
        <ul class="chips">${ARSENAL.map(a => `<li>${fmt(a)}</li>`).join('')}</ul>
      </div>
    </div>`;
  },
  projets() {
    return `<div class="files">${C().projets.map((p, i) => `
      <article class="file panel" tabindex="0" data-i="${i}" aria-labelledby="pj-${i}">
        <span class="stamp" ${state.read.has(i) ? '' : 'hidden'}>${T().read}</span>
        <div class="top"><span>${T().file} #${String(i + 1).padStart(2, '0')}</span><span class="pill">${fmt(p.status)}</span></div>
        <h3 id="pj-${i}">${fmt(p.title)}</h3>
        <p class="tag">${fmt(p.tag)}</p>
        <p class="d">${fmt(p.desc)}</p>
        <ul class="chips">${p.stack.map(s => `<li>${fmt(s)}</li>`).join('')}</ul>
        ${p.href ? `<a href="${esc(p.href)}" target="_blank" rel="noopener">${T().see}</a>` : ''}
      </article>`).join('')}</div>`;
  },
  education() { return frise(C().education); },
  experience() { return frise(C().experience); },
  contact() {
    return `<div class="contacts">${C().contact.map((c, i) => `
      <div class="crow panel">
        <span class="lab">${fmt(c.label)}</span>
        <span class="val" id="cv-${i}">${c.href ? `<a href="${esc(c.href)}" target="_blank" rel="noopener">${fmt(c.value)}</a>` : fmt(c.value)}</span>
        <button class="copy" type="button" data-i="${i}">${T().copy}</button>
      </div>`).join('')}
      <p class="outro">${esc(T().outro)}</p>
    </div>`;
  }
};
function frise(list) {
  return `<ol class="frise">${list.map(e => `
    <li><span class="yr">${fmt(e.years)}</span><h3>${fmt(e.title)}</h3><p class="place">${fmt(e.place)}</p>${e.note ? `<p class="note">${fmt(e.note)}</p>` : ''}${e.points ? `<ul class="points">${e.points.map(p => `<li>${fmt(p)}</li>`).join('')}</ul>` : ''}</li>`).join('')}</ol>`;
}

/* =====================================================================
   ÉTAT, SCORE, LANGUE ET NAVIGATION
   ===================================================================== */
const state = { sel: 0, open: null, busy: false, score: 0, shown: 0, combo: 1, comboUntil: 0, maxCombo: 1,
  visited: new Set(), read: new Set(), copied: false, graded: false, t0: performance.now() };
const els = {
  menu: $('#menuScreen'), nav: $('#menuNav'), list: $('#menuList'), chapter: $('#chapter'), body: $('#chapterBody'),
  chKicker: $('#chKicker'), chTitle: $('#chTitle'), back: $('#back'),
  card: $('#card'), cardNum: $('#cardNum'), cardTitle: $('#cardTitle'), cardSub: $('#cardSub'),
  grade: $('#grade'), gradeLetter: $('#gradeLetter'), gradeStats: $('#gradeStats'), gradeOk: $('#gradeOk'),
  score: $('#score'), combo: $('#combo'), comboBar: $('#comboBar'), tc: $('#timecode'), date: $('#date'),
  mute: $('#mute'), lang: $('#lang'), pops: $('#pops'), title: $('#title'), titleWrap: $('#titleWrap'), tagline: $('#tagline'), soundHint: $('#soundHint')
};
let items = [], chars = [], skipCard = null;

function setAcc(el, c) { el.style.setProperty('--acc', `var(${c.acc})`); el.style.setProperty('--chroma', `var(${c.chroma})`); }

function award(base, label, x, y) {
  const now = performance.now();
  state.combo = now < state.comboUntil ? Math.min(state.combo + 1, 8) : 1;
  state.comboUntil = now + 5000;
  state.maxCombo = Math.max(state.maxCombo, state.combo);
  const pts = base * state.combo;
  state.score += pts;
  els.combo.textContent = `COMBO ×${state.combo}`;
  const p = document.createElement('div');
  p.className = 'pop';
  p.innerHTML = `+${pts}${state.combo > 1 ? ` ×${state.combo}` : ''}<small>${esc(label)}</small>`;
  p.style.left = Math.min(Math.max(x, 110), innerWidth - 110) + 'px';
  p.style.top = Math.min(Math.max(y, 90), innerHeight - 90) + 'px';
  els.pops.append(p);
  setTimeout(() => p.remove(), 1700);
  Sound.coin();
}

function renderMenu() {
  items.forEach((b, i) => {
    const c = CHAPTERS[i];
    b.querySelector('.lbl').textContent = c.label[lang];
    b.querySelector('.loc').textContent = `« ${c.loc[lang]} »`;
    b.querySelector('.seen').textContent = T().seen;
    b.querySelector('.seen').hidden = !state.visited.has(c.id);
  });
}
function renderMute() {
  const m = Sound.isMuted();
  els.mute.textContent = m ? T().soundOff : T().soundOn;
  els.mute.setAttribute('aria-pressed', String(m));
}
function renderDate() {
  const d = new Date();
  els.date.textContent = `${String(d.getDate()).padStart(2, '0')} ${T().months[d.getMonth()]} 1989`;
}
function renderChapter(c) {
  setAcc(els.chapter, c);
  els.chKicker.textContent = `${T().chapter} ${c.num} · « ${c.loc[lang]} »`;
  els.chTitle.textContent = c.label[lang];
  els.body.innerHTML = RENDER[c.id]();
  if (els.body.querySelector('.todo')) {
    const [a, b, z] = T().todoNote;
    els.body.insertAdjacentHTML('beforeend', `<p class="foot-note">${esc(a)}<span class="todo">${esc(b)}</span>${esc(z)}</p>`);
  }
  wire(c.id);
}
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T()[el.dataset.t]; });
  els.lang.querySelectorAll('[data-l]').forEach(s => { s.className = s.dataset.l === lang ? 'on' : 'off'; });
  els.lang.setAttribute('aria-label', T().langSwitch);
  els.nav.setAttribute('aria-label', T().nav);
  els.tagline.innerHTML = `${fmt(C().role)}<span class="sep">//</span>${fmt(C().tagline)}`;
  renderMenu(); renderMute(); renderDate();
  if (state.open) {
    const c = CHAPTERS.find(x => x.id === state.open);
    const top = els.chapter.scrollTop;
    renderChapter(c);
    els.chapter.scrollTop = top;
  }
  if (!els.grade.hidden) fillGrade();
}
function toggleLang() {
  if (state.busy) return;
  lang = lang === 'fr' ? 'en' : 'fr';
  store.set('neon89-lang', lang);
  applyLang();
  Sound.blip();
}

function select(i, sound) {
  if (state.sel === i && items[i].classList.contains('sel')) return;
  state.sel = i;
  items.forEach((b, k) => b.classList.toggle('sel', k === i));
  if (sound) Sound.blip();
}
function move(d) { const i = (state.sel + d + items.length) % items.length; items[i].focus(); Sound.blip(); }
function go(i) { const id = CHAPTERS[i].id; if (location.hash.slice(1) === id) route(); else location.hash = id; }
function route() {
  if (state.busy) return;
  const id = location.hash.slice(1), i = CHAPTERS.findIndex(c => c.id === id);
  if (i >= 0) { if (state.open !== id) openChapter(i); }
  else if (state.open) closeChapter();
}
function waitOrSkip(ms) {
  return new Promise(res => {
    let finished = false;
    const done = () => { if (finished) return; finished = true; clearTimeout(tm); skipCard = null; res(); };
    const tm = setTimeout(done, ms);
    setTimeout(() => { if (!finished) skipCard = done; }, 200);
  });
}

async function openChapter(i) {
  state.busy = true;
  const c = CHAPTERS[i];
  select(i, false);
  Sound.confirm();
  setAcc(els.card, c);
  els.cardNum.textContent = `${T().chapter} ${c.num}`;
  els.cardTitle.textContent = c.label[lang].toUpperCase();
  els.cardSub.textContent = `« ${c.loc[lang]} »`;
  els.card.classList.remove('on'); els.card.hidden = false; void els.card.offsetWidth; els.card.classList.add('on');
  await waitOrSkip(RM ? 900 : 1900);

  renderChapter(c);
  els.menu.hidden = true; els.chapter.hidden = false; els.chapter.scrollTop = 0;
  document.body.classList.add('in-chapter');
  Sound.muffle(true);
  els.card.hidden = true;
  state.open = c.id; state.busy = false;
  els.back.focus({ preventScroll: true });
  const r = els.chTitle.getBoundingClientRect();
  const fx = r.left + Math.min(r.width, 320) / 2, fy = r.bottom + 30;
  if (!state.visited.has(c.id)) {
    state.visited.add(c.id);
    items[i].querySelector('.seen').hidden = false;
    award(1000, T().firstVisit, fx, fy);
  } else award(100, T().revisit, fx, fy);
  route();
}

async function closeChapter() {
  state.busy = true;
  Sound.rewind();
  $('#rew').hidden = false;
  await wait(RM ? 200 : 520);
  $('#rew').hidden = true; els.chapter.hidden = true; els.menu.hidden = false;
  document.body.classList.remove('in-chapter');
  Sound.muffle(false);
  state.open = null; state.busy = false;
  items[state.sel].focus({ preventScroll: true });
  if (!state.graded && state.visited.size === CHAPTERS.length) showGrade();
  route();
}

function wire(id) {
  if (id === 'presentation') { const a = $('#avatar'); if (a) drawPortrait(a); }
  if (id === 'projets') {
    els.body.querySelectorAll('.file').forEach(el => {
      const read = () => {
        const i = +el.dataset.i; if (state.read.has(i)) return;
        state.read.add(i); el.querySelector('.stamp').hidden = false;
        const r = el.getBoundingClientRect(); award(250, T().fileRead, r.left + r.width / 2, r.top + 30);
      };
      el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') read(); });
      el.addEventListener('focus', read);
      el.addEventListener('click', read);
    });
  }
  if (id === 'contact') {
    els.body.querySelectorAll('.copy').forEach(btn => {
      btn.addEventListener('click', async () => {
        const i = +btn.dataset.i, v = C().contact[i].href || C().contact[i].value;
        let ok = false;
        try { await navigator.clipboard.writeText(v); ok = true; } catch { ok = false; }
        if (!ok) {
          const r = document.createRange(); r.selectNodeContents($('#cv-' + i));
          const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        }
        btn.textContent = ok ? T().copied : T().selected;
        setTimeout(() => { btn.textContent = T().copy; }, 1600);
        if (!state.copied) { state.copied = true; const b = btn.getBoundingClientRect(); award(500, T().contactMade, b.left + b.width / 2, b.top); }
      });
    });
  }
}

function fillGrade() {
  const secs = Math.round((performance.now() - state.t0) / 1000), s = state.score, L = T().rows;
  const rows = [
    [L[0], `${state.visited.size}/${CHAPTERS.length}`],
    [L[1], `${state.read.size}/${C().projets.length}`],
    [L[2], `×${state.maxCombo}`],
    [L[3], `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`],
    [L[4], String(s).padStart(7, '0')]
  ];
  els.gradeStats.innerHTML = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
}
function showGrade() {
  state.graded = true;
  const s = state.score;
  els.gradeLetter.textContent = s >= 9000 ? 'S' : s >= 6500 ? 'A' : s >= 4500 ? 'B' : 'C';
  fillGrade();
  els.grade.hidden = false;
  Sound.fanfare();
  els.gradeOk.focus();
}
function hideGrade() { els.grade.hidden = true; items[state.sel].focus({ preventScroll: true }); }

function toggleMute() {
  Sound.setMuted(!Sound.isMuted());
  store.set('neon89-muted', Sound.isMuted() ? '1' : '0');
  renderMute();
  updateHint();
}
function updateHint() { els.soundHint.hidden = Sound.isPlaying() || Sound.isMuted(); }
function unlock() { if (!Sound.isMuted()) Sound.start(); updateHint(); }

/* boucle d'interface : nom qui ondule, pulsation sur le temps, score qui défile */
function uiLoop(now) {
  const t = now / 1000;
  if (!els.menu.hidden) {
    if (!RM) chars.forEach((ch, i) => {
      ch.style.transform = `translateY(${(Math.sin(t * 2.2 + i * 0.7) * 0.045).toFixed(4)}em) rotate(${(Math.sin(t * 1.6 + i * 0.9) * 2.5).toFixed(2)}deg)`;
    });
    const p = RM ? 0 : Sound.pulse();
    els.titleWrap.style.transform = `scale(${(1 + 0.03 * p).toFixed(4)})`;
  }
  if (state.shown !== state.score) {
    state.shown += Math.max(1, Math.ceil((state.score - state.shown) * 0.12));
    if (state.shown > state.score) state.shown = state.score;
    els.score.textContent = String(state.shown).padStart(7, '0');
  }
  const left = Math.max(0, state.comboUntil - performance.now());
  els.comboBar.style.width = (left / 5000 * 100).toFixed(1) + '%';
  if (left === 0 && state.combo !== 1) { state.combo = 1; els.combo.textContent = 'COMBO ×1'; }
  requestAnimationFrame(uiLoop);
}

function startApp(saved) {
  if (saved && typeof saved === 'object') {
    state.score = state.shown = +saved.score || 0;
    (saved.visited || []).forEach(v => state.visited.add(v));
    (saved.read || []).forEach(v => state.read.add(v));
    state.graded = !!saved.graded; state.copied = !!saved.copied; state.maxCombo = +saved.maxCombo || 1;
  }
  [...PROFILE.name.toUpperCase()].forEach(c => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; s.setAttribute('aria-hidden', 'true'); els.title.append(s); chars.push(s); });
  els.title.setAttribute('aria-label', PROFILE.name);
  CHAPTERS.forEach((c, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<button class="item" type="button" data-i="${i}"><span class="num">${c.num}</span><span class="lbl"></span><span class="seen" hidden></span><span class="loc"></span></button>`;
    els.list.append(li);
  });
  items = [...els.list.querySelectorAll('.item')];
  items.forEach((b, i) => {
    b.addEventListener('click', () => { if (!state.busy) go(i); });
    b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && !state.busy) select(i, true); });
    b.addEventListener('focus', () => select(i, false));
  });
  select(0, false);
  els.score.textContent = String(state.score).padStart(7, '0');
  if (store.get('neon89-muted') === '1') Sound.setMuted(true);
  applyLang();
  updateHint();
  setInterval(() => {
    const s = Math.floor((performance.now() - state.t0) / 1000);
    els.tc.textContent = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(n => String(n).padStart(2, '0')).join(':');
  }, 250);
  els.mute.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
  els.lang.addEventListener('click', e => { e.stopPropagation(); unlock(); toggleLang(); });
  addEventListener('pointerdown', unlock);
  els.back.addEventListener('click', () => { location.hash = 'menu'; });
  els.card.addEventListener('pointerdown', () => { if (skipCard) skipCard(); });
  els.gradeOk.addEventListener('click', hideGrade);
  addEventListener('hashchange', route);
  addEventListener('keydown', e => {
    unlock();
    const k = e.key;
    if (skipCard) { if (!e.repeat) { e.preventDefault(); skipCard(); } return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (k === 'm' || k === 'M') { toggleMute(); return; }
    if (k === 'l' || k === 'L') { toggleLang(); return; }
    if (!els.grade.hidden) { if (k === 'Escape') { e.preventDefault(); hideGrade(); } return; }
    if (state.busy) return;
    if (state.open) { if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); location.hash = 'menu'; } return; }
    if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); move(1); }
    else if (k === 'ArrowUp' || k === 'z' || k === 'Z' || k === 'w' || k === 'W') { e.preventDefault(); move(-1); }
    else if (/^[1-9]$/.test(k) && +k <= CHAPTERS.length) { e.preventDefault(); go(+k - 1); }
    else if ((k === 'Enter' || k === ' ') && !(document.activeElement instanceof HTMLButtonElement)) { e.preventDefault(); go(state.sel); }
  });
  if (!RM) {
    const glitch = () => { els.title.classList.add('glitch'); setTimeout(() => els.title.classList.remove('glitch'), 320); setTimeout(glitch, 3500 + Math.random() * 3500); };
    setTimeout(glitch, 2600);
  }
  setTimeout(() => $('#boot')?.remove(), 1400);
  City.start();
  requestAnimationFrame(uiLoop);
  route();
  try {
    window.claude?.hot?.snapshot?.(() => ({ score: state.score, visited: [...state.visited], read: [...state.read], graded: state.graded, copied: state.copied, maxCombo: state.maxCombo }));
  } catch { /* hors visionneuse */ }
}

const hot = window.claude?.hot;
if (hot?.ready) hot.ready(startApp); else startApp(hot?.data ?? {});
})();
</script>
